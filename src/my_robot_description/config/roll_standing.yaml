# Current ten-joint ros2_control configuration.
# Effort commands follow model/roll_stance.py joint order; update rate is Hz.

# Ten-joint prototype only. Gains/motor caps live in roll_posture.py / roll_stance.py.
controller_manager:
  ros__parameters:
    update_rate: 250
    enforce_command_limits: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    roll_effort_controller:
      type: forward_command_controller/ForwardCommandController
roll_effort_controller:
  ros__parameters:
    joints: [left_hip_roll, left_hip_pitch, left_knee_pitch, left_ankle_pitch, left_ankle_roll, right_hip_roll, right_hip_pitch, right_knee_pitch, right_ankle_pitch, right_ankle_roll]
    interface_name: effort
